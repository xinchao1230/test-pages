<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NurF Campaign Screenshots Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
        }

        .sidebar-header h1 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .search-container {
            position: relative;
            margin-top: 10px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            display: none;
        }

        .stats {
            margin-top: 10px;
            font-size: 12px;
            color: #ecf0f1;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .category-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .category-item:hover {
            background-color: #f8f9fa;
        }

        .category-item.active {
            background-color: #3498db;
            color: white;
        }

        .category-name {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .category-count {
            font-size: 12px;
            color: #666;
        }

        .category-item.active .category-count {
            color: #ecf0f1;
        }

        /* Subcategory sections in main content area */
        .subcategory-section {
            margin-bottom: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            display: block; /* Ensure subcategory sections stack vertically */
        }

        .subcategory-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subcategory-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .subcategory-description {
            font-size: 12px;
            opacity: 0.9;
            margin: 0;
        }

        .subcategory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: fit-content;
        }

        /* Enhanced campaign item for subcategory view */
        .campaign-item.in-subcategory {
            width: 280px;
            flex-shrink: 0;
            margin-bottom: 0;
            flex-basis: 280px;
        }

        /* Single category view without subcategories */
        .single-category-view {
            padding: 0;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .content-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .content-subtitle {
            color: #666;
            font-size: 14px;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .campaign-grid {
            display: block; /* Changed from grid to block for subcategory layout */
        }

        /* Grid layout only for single category view */
        .campaign-grid.single-category-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .campaign-item {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .campaign-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .campaign-header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }

        .campaign-id {
            font-weight: 600;
            color: #2980b9;
            font-size: 14px;
            word-break: break-all;
        }

        .screenshot-container {
            padding: 15px;
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screenshot {
            max-width: 100%;
            max-height: 180px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .screenshot:hover {
            transform: scale(1.02);
        }

        .no-screenshot {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .loading {
            color: #f39c12;
            font-style: italic;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 95%;
            max-height: 95%;
            margin-top: 2%;
        }

        .modal-header {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 16px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #bbb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 200px;
            }
            
            .category-list {
                display: flex;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 10px;
            }
            
            .category-item {
                min-width: 150px;
                margin-right: 10px;
                border-radius: 4px;
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>NURF Campaign Viewer</h1>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search campaigns..." id="searchInput">
                    <button class="search-clear" id="searchClear">&times;</button>
                </div>
                <div class="stats" id="statsDisplay">
                    Loading campaigns...
                </div>
            </div>
            <div class="category-list" id="categoryList">
                <!-- Categories will be populated by JavaScript -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-header">
                <div class="content-title" id="contentTitle">All Campaigns</div>
                <div class="content-subtitle" id="contentSubtitle">Select a category to view campaigns</div>
            </div>
            <div class="content-body">
                <div class="campaign-grid" id="campaignGrid">
                    <!-- Campaigns will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for full-size images -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-header" id="modalHeader">Campaign Name</div>
        <img class="modal-content" id="modalImage">
    </div>

    <!-- Campaign data is auto-generated from nurturing_metadata_synchronous_json.cc -->
    <!-- Run update_campaign_data.ps1 to regenerate campaigns_data.js -->
    <script src="campaigns_data.js"></script>
    <script>
        // Fallback: if campaigns_data.js failed to load, provide empty data
        if (typeof campaignData === 'undefined') {
            console.error('campaigns_data.js not found! Run update_campaign_data.ps1 first.');
            window.campaignData = {};
        }

        // Global variables
        let currentCategory = 'all';
        let currentSearchTerm = '';
        let filteredCampaigns = [];

        // DOM elements
        const categoryList = document.getElementById('categoryList');
        const campaignGrid = document.getElementById('campaignGrid');
        const contentTitle = document.getElementById('contentTitle');
        const contentSubtitle = document.getElementById('contentSubtitle');
        const statsDisplay = document.getElementById('statsDisplay');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalHeader = document.getElementById('modalHeader');
        const span = document.getElementsByClassName('close')[0];

        // Helper function to get all campaigns from a category
        function getAllCampaignsInCategory(categoryData) {
            if (categoryData.campaigns) {
                return categoryData.campaigns;
            } else if (categoryData.subcategories) {
                let allCampaigns = [];
                Object.values(categoryData.subcategories).forEach(subcat => {
                    allCampaigns = allCampaigns.concat(subcat.campaigns);
                });
                return allCampaigns;
            }
            return [];
        }

        // Initialize the application
        function init() {
            populateCategories();
            setupEventListeners();
            showCategory('all');
        }

        // Populate category list
        function populateCategories() {
            let totalCampaigns = 0;
            Object.values(campaignData).forEach(cat => {
                totalCampaigns += getAllCampaignsInCategory(cat).length;
            });

            // Add "All" category
            const allItem = createCategoryItem('all', 'All Campaigns', totalCampaigns, true);
            categoryList.appendChild(allItem);

            // Add individual categories (simplified - no subcategory UI in sidebar)
            Object.keys(campaignData).forEach(categoryKey => {
                const category = campaignData[categoryKey];
                const allCampaigns = getAllCampaignsInCategory(category);
                
                const item = createCategoryItem(categoryKey, category.name, allCampaigns.length);
                categoryList.appendChild(item);
            });

            updateStats(totalCampaigns, totalCampaigns);
        }

        // Create category list item (simplified)
        function createCategoryItem(key, name, count, active = false) {
            const item = document.createElement('div');
            item.className = `category-item ${active ? 'active' : ''}`;
            item.dataset.category = key;
            
            item.innerHTML = `
                <div class="category-name">${name}</div>
                <div class="category-count">${count} campaigns</div>
            `;
            
            item.addEventListener('click', () => showCategory(key));
            return item;
        }

        // Show category
        function showCategory(categoryKey) {
            currentCategory = categoryKey;
            
            // Update active category
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-category="${categoryKey}"]`).classList.add('active');
            
            // Get campaigns for category
            let campaigns = [];
            if (categoryKey === 'all') {
                Object.values(campaignData).forEach(cat => {
                    campaigns = campaigns.concat(getAllCampaignsInCategory(cat));
                });
                contentTitle.textContent = 'All Campaigns';
                contentSubtitle.textContent = `Viewing all ${campaigns.length} campaigns`;
            } else {
                campaigns = getAllCampaignsInCategory(campaignData[categoryKey]);
                contentTitle.textContent = campaignData[categoryKey].name;
                contentSubtitle.textContent = `${campaigns.length} campaigns in this category`;
            }
            
            // Apply search filter and render with subcategories
            applySearch(campaigns);
        }

        // Apply search filter
        function applySearch(campaigns = null) {
            if (campaigns === null) {
                // Get current campaigns
                if (currentCategory === 'all') {
                    campaigns = [];
                    Object.values(campaignData).forEach(cat => {
                        campaigns = campaigns.concat(getAllCampaignsInCategory(cat));
                    });
                } else {
                    campaigns = getAllCampaignsInCategory(campaignData[currentCategory]);
                }
            }
            
            // Filter by search term
            if (currentSearchTerm) {
                filteredCampaigns = campaigns.filter(campaign => 
                    campaign.toLowerCase().includes(currentSearchTerm.toLowerCase())
                );
            } else {
                filteredCampaigns = campaigns;
            }
            
            // Render with subcategory layout if applicable
            if (currentCategory !== 'all' && campaignData[currentCategory].subcategories && !currentSearchTerm) {
                renderCampaignsWithSubcategories();
            } else {
                renderCampaigns(filteredCampaigns);
            }
            
            updateStats(filteredCampaigns.length, campaigns.length);
        }

        // Render campaigns with subcategory grouping
        function renderCampaignsWithSubcategories() {
            campaignGrid.innerHTML = '';
            campaignGrid.className = 'campaign-grid';
            const category = campaignData[currentCategory];
            
            if (!category.subcategories) {
                renderCampaigns(filteredCampaigns);
                return;
            }
            
            // Create subcategory sections
            Object.keys(category.subcategories).forEach(subcatKey => {
                const subcategory = category.subcategories[subcatKey];
                const subcatCampaigns = subcategory.campaigns;
                
                if (subcatCampaigns.length === 0) return;
                
                // Create subcategory section
                const section = document.createElement('div');
                section.className = 'subcategory-section';
                
                // Create header
                const header = document.createElement('div');
                header.className = 'subcategory-header';
                header.innerHTML = `
                    <h3 class="subcategory-title">${subcategory.name}</h3>
                    <span class="subcategory-description">${subcatCampaigns.length} campaigns</span>
                `;
                
                // Create flex grid for this subcategory (with wrapping)
                const grid = document.createElement('div');
                grid.className = 'subcategory-grid';
                
                subcatCampaigns.forEach(campaignId => {
                    const item = createCampaignItem(campaignId);
                    item.classList.add('in-subcategory');
                    grid.appendChild(item);
                });
                
                section.appendChild(header);
                section.appendChild(grid);
                campaignGrid.appendChild(section);
            });
            
            if (campaignGrid.children.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <h3>No campaigns found</h3>
                    <p>No campaigns in this category</p>
                `;
                campaignGrid.appendChild(emptyState);
            }
        }

        // Render campaigns (original function for single list view)
        function renderCampaigns(campaigns) {
            campaignGrid.innerHTML = '';
            campaignGrid.className = 'campaign-grid single-category-view';
            
            if (campaigns.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <h3>No campaigns found</h3>
                    <p>${currentSearchTerm ? 'Try adjusting your search terms' : 'No campaigns in this category'}</p>
                `;
                campaignGrid.appendChild(emptyState);
                return;
            }
            
            campaigns.forEach(campaignId => {
                const item = createCampaignItem(campaignId);
                campaignGrid.appendChild(item);
            });
        }

        // Create campaign item
        function createCampaignItem(campaignId) {
            const item = document.createElement('div');
            item.className = 'campaign-item';
            
            item.innerHTML = `
                <div class="campaign-header">
                    <div class="campaign-id">${campaignId}</div>
                </div>
                <div class="screenshot-container">
                    <div class="loading">Loading screenshot...</div>
                </div>
            `;
            
            // Load screenshot
            const container = item.querySelector('.screenshot-container');
            loadScreenshot(campaignId, container);
            
            return item;
        }

        // Load screenshot
        function loadScreenshot(campaignId, container) {
            const img = document.createElement('img');
            img.className = 'screenshot';
            img.alt = campaignId;
            img.src = `screenshots/${campaignId}.png`;
            
            img.onload = function() {
                container.innerHTML = '';
                container.appendChild(img);
                img.onclick = function() {
                    openModal(img.src, campaignId);
                };
            };
            
            img.onerror = function() {
                // Try to load Default.png as fallback
                const defaultImg = document.createElement('img');
                defaultImg.className = 'screenshot';
                defaultImg.alt = `${campaignId} (Default)`;
                defaultImg.src = 'screenshots/Default.png';
                
                defaultImg.onload = function() {
                    container.innerHTML = '';
                    container.appendChild(defaultImg);
                    defaultImg.onclick = function() {
                        openModal(defaultImg.src, campaignId);
                    };
                };
                
                defaultImg.onerror = function() {
                    // If Default.png also doesn't exist, show no screenshot message
                    container.innerHTML = '<div class="no-screenshot">Screenshot not available</div>';
                };
            };
        }

        // Open modal
        function openModal(imgSrc, campaignId) {
            modal.style.display = 'block';
            modalImg.src = imgSrc;
            modalImg.alt = campaignId;
            modalHeader.textContent = campaignId;
        }

        // Update stats
        function updateStats(shown, total) {
            if (currentSearchTerm) {
                statsDisplay.textContent = `Showing ${shown} of ${total} campaigns`;
            } else {
                statsDisplay.textContent = `${total} campaigns total`;
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value.trim();
                searchClear.style.display = currentSearchTerm ? 'block' : 'none';
                applySearch();
            });
            
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchTerm = '';
                searchClear.style.display = 'none';
                applySearch();
            });
            
            // Modal functionality
            span.onclick = function() {
                modal.style.display = 'none';
            }
            
            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                }
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
